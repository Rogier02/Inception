services:
  nginx:
    build: ./requirements/nginx
    container_name: nginx
    image: nginx
    depends_on:
      - wordpress
    ports:
      - "443:443"
    volumes:
      - wordpress_files:/var/www/wordpress
    networks:
      - inception_network
    restart: unless-stopped
    env_file:
      - .env

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    image: wordpress
    depends_on:
      - mariadb
    expose:
      - "9000"
    volumes:
      - wordpress_files:/var/www/wordpress
    networks:
      - inception_network
    restart: unless-stopped
    env_file:
      - .env
    secrets:
      - db_password
      - credentials

  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    image: mariadb
    expose:
      - "3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception_network
    restart: unless-stopped
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password

volumes:
  wordpress_files:
    name: wordpress_files
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/wordpress

  db_data:
    name: db_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/mariadb

networks:
  inception_network:
    driver: bridge

secrets:
  db_password:
    file: ../../secrets/db_password.txt
  db_root_password:
    file: ../../secrets/db_root_password.txt
  credentials:
    file: ../../secrets/credentials.txt
