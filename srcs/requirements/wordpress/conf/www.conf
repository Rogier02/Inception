[www]
user  = nobody
group = nobody

; Listen on TCP so NGINX can reach us across the Docker network
listen = 9000

pm                   = dynamic
pm.max_children      = 5
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Pass container environment variables through to PHP processes
clear_env = no
 